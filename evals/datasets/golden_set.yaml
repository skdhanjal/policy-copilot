    of the actual 314.2(m) text) but emitted ZERO [cite: ...] tags despite an explicit
    system-prompt instruction to cite every claim in that format. Result: cited=[]
    , unverifiable=[] -- the fabrication-detection mechanism (unverifiable_citations)
    is SILENT in this case, not because nothing needed checking, but because it has
    nothing to check. This means citation-format compliance itself needs to be measured
    and enforced (e.g. reject/retry a response with zero citations when the answer
    contains specific factual claims), or the mechanical safety check built in generate.py
    cannot be trusted to fire when it matters. PASS requires: at least one [cite:
    ...] tag present when the answer contains specific quoted or paraphrased regulatory
    text.

    '
