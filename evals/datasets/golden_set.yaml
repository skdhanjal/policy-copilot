- id: diachronic-notification-event-001
  severity: blocking
  known_unreliable_checks:
  - faithfulness
  checks:
  - faithfulness
  - date_binding
  - citation_presence
  category: diachronic
  source: captured
  question: has 314.2 changed since 2023
  jurisdiction: null
  expected_intent: diachronic
  expected_family: cfr-16-314
  expected_section: '314.2'
  expected_versions: 5
  expected_answer_contains:
  - '2024-05-13'
  - notification event
  must_not_claim: 'That the "notification event" definition (subsection m) appears
    in the 2023-11-13 version. Independently verified against expand_lineage() output:
    the phrase "notification event" is absent from every version through 2023-11-13
    and present only starting 2024-05-13.

    '
  rubric: 'CAPTURED FAILURE, not hypothetical. gpt-4o-mini, given correct, independently-verified,
    correctly-labeled context (confirmed by inspecting the literal rendered prompt
    block-by-block against ground truth), non-deterministically misattributes this
    definition''s introduction to the 2023-11-13 version instead of 2024-05-13. Measured:
    2 of 3 runs wrong at temperature=0, identical input. A targeted system-prompt
    instruction explicitly warning against exactly this failure mode ("only attribute
    a term to a version if it appears verbatim in that version''s block") did NOT
    reliably fix it -- kept in the prompt as harmless, but this item exists because
    the fix is unproven and needs systematic tracking, not a single re-run. PASS requires:
    correctly states 2024-05-13 as the introduction date. A response stating 2023-11-13
    is a FAIL regardless of how fluent or well-cited it otherwise reads.

    METRIC FINDING: Ragas faithfulness scores this exact failure at 1.0 (verified
    twice, including one properly-reproduced run after fixing a detector bug in the
    test harness itself). Faithfulness checks whether claim content traces to the
    context AS A WHOLE, not whether it is bound to the correct entity/date within
    a multi-version context -- structurally blind to this failure class. Custom deterministic
    check built (app/rag/eval_metrics.py: check_date_bindings) correctly flags the
    misattributed sentence as content_verified=False. KNOWN LIMITATION of the custom
    check: cannot distinguish a correct negative claim ("X was absent in version Y")
    from an incorrect positive claim -- both currently produce content_verified=False,
    since the check only tests word overlap, not claim polarity. Acceptable for a
    first pass; flagged for Phase 2 if negation claims turn out to be common in real
    usage.

    '
- id: adversarial-citation-priority-001
  severity: blocking
  known_unreliable_checks: []
  checks:
  - citation_coverage
  category: adversarial
  source: captured
  question: has 314.2 changed since 2023
  jurisdiction: null
  rubric: 'Not adversarial in the injection sense -- adversarial against our OWN retrieval
    mechanism. Verified failure mode: semantic search alone scored an UNRELATED section
    (314.5, whose text happens to contain the word "effective") at 0.455, higher than
    every other candidate, and never surfaced 314.2 -- the section literally named
    in the question -- anywhere in the top 8 results. Fixed by extracting explicit
    CFR citations and routing them directly (current_chunk lookup for point-in-time,
    expand_lineage for diachronic) rather than trusting embedding similarity to rank
    a literal citation correctly. PASS requires: when a question contains an explicit
    section number, that exact section must appear in resolved/lineage output. A response
    that never engages with the literally-cited section is a FAIL even if its prose
    about the topic in general is accurate.

    '
