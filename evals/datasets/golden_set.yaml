- id: hallucination-fabricated-comparison-001
  severity: blocking
  known_unreliable_checks:
  - faithfulness
  checks:
  - faithfulness
  - date_binding
  - abstention
  category: diachronic
  source: captured
  question: how has 12 CFR 1005.18's payroll card provisions changed in the last two
    years
  jurisdiction: null
  expected_outcome: no_change_detected
  rubric: 'CAPTURED FAILURE, more severe than diachronic-notification-event-001. Given
    retrieved context confirmed byte-identical across all 5 ingested versions (verified
    independently via expand_lineage: all 5 texts equal, 63354 chars each), the model
    fabricated a full structural comparison between "March 20, 2023" and "October
    1, 2025" versions, inventing specific subsection labels (e.g. "(b)(2)(xiv)") and
    describing content as if genuine differences existed. This is not a misattributed
    date on top of a real change (contrast diachronic-notification-event-001) -- it
    is a manufactured narrative of change where verified ground truth shows none.
    Retrieval was correct; generation invented content wholesale. PASS requires: explicit
    statement that no change was found across the versions shown. A structured, confident
    comparison for this question is an automatic FAIL regardless of surface plausibility.

    STATUS: FIXED (verified). Root cause: model was asked to judge identity from raw
    text itself. Fix: identity is now computed deterministically in _render_context()
    (exact string comparison) and stated directly in the prompt rather than left as
    an inference task. Re-tested 3/3 correct after fix, versus the unrelated diachronic-notification-event-001
    fix attempt (a soft prompt instruction) which only achieved 1/3. Kept as a permanent
    regression test -- this exact code path must keep producing ''no change'' for
    this question going forward.

    '
