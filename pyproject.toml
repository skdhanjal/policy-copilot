[project]
name = "policy-copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shashi Kumar", email = "skdhanjal777@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lxml>=6.1.2",
    "openai>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
policy-copilot = "policy_copilot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
