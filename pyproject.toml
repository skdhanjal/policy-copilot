[project]
name = "policy-copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shashi Kumar", email = "skdhanjal777@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "datasets>=4.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lxml>=6.1.2",
    "openai>=2.0.0,<3.0.0",  # ragas's `instructor` dep caps openai<3.0.0 (confirmed via `uv lock`);
                             # 2.54.0 verified working for every real code path in this project
                             # (retrieval, generation, the agent loop, all ragas checks) before pinning
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",  # listed explicitly, not just left as sentence-transformers's
                       # transitive dep -- confirmed the [tool.uv.sources] override
                       # below is silently ignored for a package uv only sees
                       # transitively; it only takes effect once torch is a direct
                       # project dependency
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# torch is a transitive dep of sentence-transformers. Default PyPI serves the
# CUDA build on Linux -- multi-GB of nvidia-*/triton packages nobody here
# runs on a GPU. `explicit = true` scopes this index to torch only, so it
# never shadows the default index for anything else (per uv's own PyTorch
# integration guide). This is what the Dockerfile used to do by hand (grep
# torch/nvidia-*/triton out of requirements.txt, pip install torch
# separately from this same URL) -- doing it here means `uv sync`/`uv lock`
# resolve to the CPU build everywhere, dev machine included, not just in CI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

