    { name = "Shashi Kumar", email = "skdhanjal777@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "datasets>=4.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
