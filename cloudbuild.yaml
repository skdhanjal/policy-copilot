steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/policy-copilot/api:$SHORT_SHA', '-f', 'Dockerfile', '.']

  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install uv -q --break-system-packages
        uv sync -q
        uv run pytest tests/ -x

  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # CI gate DISABLED (D52): ci_gate.py imports ragas via checks.py,
        # but ragas deliberately lives only in .venv-eval (D37-D39 conflict
        # with langgraph), not main deps. Needs a separate pipeline step
        # using .venv-eval's dependency set before this can be re-enabled.
        echo "CI gate skipped -- see DECISIONS.md D52"

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/policy-copilot/api:$SHORT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'policy-copilot-api'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/policy-copilot/api:$SHORT_SHA'
      - '--region=asia-south1'
      - '--no-traffic'
      - '--tag=canary'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/policy-copilot/api:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
