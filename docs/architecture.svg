<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Policy Copilot architecture</title>
<desc>A question flows through guardrails, intent classification, two-stage retrieval, reranking, a self-correcting agent loop, generation via a gateway with provider fallback, and a cache, before returning an answer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
</style>

<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="46" text-anchor="middle" fill="#2C2C2A">Question</text>
<line x1="340" y1="64" x2="340" y2="92" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="96" width="280" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="340" y="122" text-anchor="middle" fill="#4A1B0C">PII redaction, injection check</text>
<line x1="340" y1="140" x2="340" y2="168" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="172" width="280" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="198" text-anchor="middle" fill="#26215C">Intent + version-aware retrieval</text>
<line x1="340" y1="216" x2="340" y2="244" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="248" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="274" text-anchor="middle" fill="#26215C">Rerank, trim context</text>
<line x1="340" y1="292" x2="340" y2="320" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="324" width="380" height="150" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="170" y="352" fill="#04342C">Agent loop</text>
<text class="ts" x="170" y="370" fill="#0F6E56">Retries on grounding failure</text>

<rect x="180" y="384" width="140" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="250" y="410" text-anchor="middle" fill="#04342C">Generate</text>
<line x1="320" y1="406" x2="358" y2="406" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="360" y="384" width="140" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="430" y="410" text-anchor="middle" fill="#04342C">Check grounded</text>

<path d="M360 428 L250 428" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="305" y="450" text-anchor="middle" fill="#5f5e5a">retry, up to 2x</text>

<line x1="340" y1="474" x2="340" y2="502" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="506" width="380" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" fill="#412402">Gateway: OpenAI primary, Gemini fallback</text>
<line x1="340" y1="550" x2="340" y2="578" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="582" width="220" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="603" text-anchor="middle" fill="#2C2C2A">Answer, cached in Redis</text>
</svg>